name: Checks

on:
  push:
  pull_request:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m unittest discover -t . -s tests
      - run: npm ci
      - run: npm test
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python scripts/check-wheel.py dist/ai_lab-*.whl
