[project]
name = "ai-lab"
version = "0.2.0"
description = "A manager for local inference engines: model catalog, measured load and unload, Hugging Face downloads"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
ai-lab = "ai_lab.main:main"
ai-lab-run = "ai_lab.hosts.launch:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ai_lab*"]

[tool.setuptools.package-data]
ai_lab = ["web/*", "web/css/*", "web/js/*", "web/js/views/*",
          "comfyui_custom_nodes/ai_lab_preset/web/*",
          "comfyui_templates/*.json",
          "vendor/sglang_omni/playground/higgs/frontend/*",
          "vendor/voxcpm_upstream/assets/*"]

[tool.coverage.run]
# Code copied from other projects is not ours to test; see ai_lab/vendor/__init__.py.
omit = ["ai_lab/vendor/*"]
